# Static SPA server for the production CRA build (see Dockerfile.prod).
# The API lives on a separate origin/port (config.corsOrigin on the backend) —
# this container only ever serves the built React app, no proxying.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Hashed filenames (CRA build output) never change content — cache hard.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must always be revalidated so deploys are picked up on refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unmatched paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
